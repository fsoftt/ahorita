name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  core:
    name: Núcleo (formato + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar herramientas
        run: dotnet tool restore

      - name: Verificar formato
        run: |
          for project in src/Ahorita.Domain src/Ahorita.Application src/Ahorita.Infrastructure tests/*/; do
            dotnet format "$project" --verify-no-changes --severity warn
          done

      - name: Pruebas
        run: |
          dotnet test --project tests/Ahorita.Domain.Tests
          dotnet test --project tests/Ahorita.Application.Tests
          dotnet test --project tests/Ahorita.Infrastructure.Tests

      - name: Migraciones al día
        run: dotnet ef migrations has-pending-model-changes -p src/Ahorita.Infrastructure -s src/Ahorita.Infrastructure

  android:
    name: App Android
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      # Anuncios de prueba: los APK de CI son para probar, nunca deben generar impresiones reales.
      - name: Compilar APK (Release, anuncios de prueba)
        run: dotnet build src/Ahorita.App -c Release -p:AhoritaTestAds=true -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"

      # Si el APK no quedó firmado con la llave versionada, no se podría instalar
      # encima de versiones anteriores: mejor fallar aquí que en el teléfono.
      - name: Verificar firma con src/Ahorita.App/debug.keystore
        run: |
          KEYSTORE_FINGERPRINT=$(keytool -list -v -keystore src/Ahorita.App/debug.keystore -storepass android -alias androiddebugkey \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          APK_PATH=$(ls src/Ahorita.App/bin/Release/net10.0-android/*-Signed.apk)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          APK_FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK_PATH" \
            | grep 'certificate SHA-256 digest:' | head -1 | sed 's/.*digest: //')
          echo "debug.keystore: $KEYSTORE_FINGERPRINT"
          echo "APK:            $APK_FINGERPRINT"
          if [ "$KEYSTORE_FINGERPRINT" != "$APK_FINGERPRINT" ]; then
            echo "::error::El APK no se firmó con src/Ahorita.App/debug.keystore."
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ahorita-apk-test-ads-${{ github.sha }}
          path: src/Ahorita.App/bin/Release/net10.0-android/*-Signed.apk
