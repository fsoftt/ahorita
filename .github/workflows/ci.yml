name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  core:
    name: Núcleo (formato + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar herramientas
        run: dotnet tool restore

      - name: Verificar formato
        run: |
          for project in src/Ahorita.Domain src/Ahorita.Application src/Ahorita.Infrastructure tests/*/; do
            dotnet format "$project" --verify-no-changes --severity warn
          done

      - name: Pruebas
        run: |
          dotnet test --project tests/Ahorita.Domain.Tests
          dotnet test --project tests/Ahorita.Application.Tests
          dotnet test --project tests/Ahorita.Infrastructure.Tests

      - name: Migraciones al día
        run: dotnet ef migrations has-pending-model-changes -p src/Ahorita.Infrastructure -s src/Ahorita.Infrastructure

  android:
    name: App Android
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Compilar
        run: dotnet build src/Ahorita.App -c Debug -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
